name: Quality (Android)

on:
  push:
    branches: [main]
    paths:
      - 'android/**'
      # The keyboard reads the shared word list and emoji catalog from
      # here; app/build.gradle.kts merges them into the asset root.
      - 'assets/keyboard/**'
      # Prose next to the code it documents cannot break the build.
      - '!android/**.md'
      - '.github/actions/setup-android/action.yml'
      - '.github/actions/report-size/**'
      - '.github/workflows/quality-android.yml'
  workflow_call:
  workflow_dispatch:

permissions:
  contents: read
  # Lets report-size post/update its size comment on same-repo pull requests.
  # Fork pull requests get a read-only token regardless, which the action
  # already tolerates.
  pull-requests: write

concurrency:
  group: quality-android-${{ github.workflow }}-${{ github.ref }}
  # A superseded pull request push is wasted minutes, but a run on main is the
  # record for a merged commit, so let that one finish.
  cancel-in-progress: ${{ github.event_name == 'pull_request' }}

jobs:
  android:
    # Work in progress re-runs the full build on every push. The checks that
    # matter run when the author marks the pull request ready.
    if: github.event_name != 'pull_request' || !github.event.pull_request.draft
    runs-on: ubuntu-24.04
    # Thirty for the build, tests and lint, and room for the model tests when a
    # change calls for them.
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          submodules: recursive
          persist-credentials: false
      - uses: ./.github/actions/setup-android
        with:
          # Branches read main's cache and never save their own, which keeps the
          # 10 GB repository cache from filling with one Gradle copy per branch
          # and evicting the entry everything else restores from.
          cache-read-only: ${{ github.ref != 'refs/heads/main' }}
      - name: Check native model catalogs and pins
        run: python3 tools/model-pins/check_catalogs.py
      - run: ./gradlew assembleFullDebug testFullDebugUnitTest lintFullDebug
        working-directory: android
      # The unit tests above stop short of native code, which is how a
      # whisper.cpp setting that dropped a sentence every thirty seconds went
      # unnoticed. This builds the pinned whisper.cpp and the app's JNI glue for
      # the runner and decodes synthesized speech with a real pinned model, when
      # a pull request touches anything between the recording and the typed
      # text, or on a manual run.
      - name: Decide whether to run the on-device model tests
        id: model-scope
        env:
          EVENT: ${{ github.event_name }}
          BASE_SHA: ${{ github.event.pull_request.base.sha }}
        run: |
          set -euo pipefail
          if [ "${EVENT}" = "workflow_dispatch" ]; then
            echo "run=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          if [ "${EVENT}" != "pull_request" ] || [ -z "${BASE_SHA}" ]; then
            echo "run=false" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          git fetch --no-tags --depth=1 origin "${BASE_SHA}"
          changed=$(git diff --name-only "${BASE_SHA}" HEAD)
          pattern='^(android/third_party/whisper\.cpp|android/app/src/main/cpp/|android/app/src/main/java/com/vocahq/vocaphone/local/|android/app/src/main/java/com/vocahq/vocaphone/audio/SpeechAudioConditioning\.kt|android/app/src/main/java/com/vocahq/vocaphone/core/(DictatedTranscript|Transcript[A-Za-z]*|CustomVocabulary|Spoken[A-Za-z]*)\.kt|android/app/src/test/cpp/|android/app/src/test/java/com/vocahq/vocaphone/local/WhisperModelEndToEndTest\.kt|tools/model-e2e/|\.github/workflows/quality-android\.yml)'
          if printf '%s\n' "${changed}" | grep -Eq "${pattern}"; then
            echo "run=true" >> "$GITHUB_OUTPUT"
          else
            echo "run=false" >> "$GITHUB_OUTPUT"
          fi

      - name: Cache the pinned test model
        if: steps.model-scope.outputs.run == 'true'
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: android/build/model-e2e/*.bin
          key: model-e2e-android-${{ hashFiles('android/app/src/main/java/com/vocahq/vocaphone/local/LocalModelCatalog.kt') }}

      - name: Run the on-device model tests
        if: steps.model-scope.outputs.run == 'true'
        working-directory: android
        run: |
          set -euo pipefail
          # No `say` on Linux; the scenario script speaks with eSpeak instead.
          sudo apt-get install -y --no-install-recommends espeak-ng >/dev/null
          cmake -S app/src/test/cpp -B build/host-whisper -DCMAKE_BUILD_TYPE=Release
          cmake --build build/host-whisper --parallel
          python3 ../tools/model-e2e/fetch_ggml.py base-q8_0 build/model-e2e
          python3 ../tools/model-e2e/make_scenarios.py build/model-e2e/scenarios
          ./gradlew :app:testFullDebugUnitTest --rerun \
            --tests 'com.vocahq.vocaphone.local.WhisperModelEndToEndTest' \
            -Dvocaphone.modelE2E="${PWD}/build/model-e2e" \
            -Dvocaphone.modelE2E.model=base-q8_0 \
            -Dvocaphone.whisperLibrary="${PWD}/build/host-whisper"

      - name: Fail if the checked-in Room schema is stale
        run: git diff --exit-code -- app/schemas
        working-directory: android

      - name: Exercise release dependency inventory
        working-directory: android
        run: ./gradlew --no-configuration-cache --init-script ../tools/android-sbom.init.gradle fullReleaseSbom fdroidReleaseSbom

      # A 4 KB-aligned library cannot be loaded at all on a 16 KB-page device,
      # and nothing else in the build says so: lint does not look, and the APK's
      # zip entries are page-aligned by AGP whatever the ELF segments say.
      - name: Fail if a 64-bit library is not 16 KB aligned
        run: python3 tools/check-page-alignment.py app/build/outputs/apk/full/debug/vocaphone-fullDebug.apk
        working-directory: android

      - name: Measure Android debug APK size
        id: size
        working-directory: android
        run: |
          set -euo pipefail
          apk=app/build/outputs/apk/full/debug/vocaphone-fullDebug.apk
          echo "bytes=$(stat -c%s "$apk")" >> "$GITHUB_OUTPUT"

      - name: Report APK size vs. main
        uses: ./.github/actions/report-size
        with:
          component: android
          label: Android debug APK
          bytes: ${{ steps.size.outputs.bytes }}
